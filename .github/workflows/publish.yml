# Publish pipeline for version tags (v*.*.*). One build, one job: wnice.exe
# is built once, the npm tarball is packed once, and those exact tarball
# bytes are attested, attached to a draft GitHub Release and only then
# published to npm (last step). The registry package and the Release asset
# are the same bytes by construction, and any failure before the final step
# leaves nothing irreversible.
#
# npm Trusted Publisher is bound to this workflow's name (publish.yml), so
# npm publishing must stay in this file.
#
# `workflow_dispatch` on a branch is a rehearsal: it runs everything through
# SHA256SUMS, the release-notes extraction (version from package.json - a
# branch run has no tag) and `npm publish --dry-run` of the same tarball.
# Only the three irreversible steps (attestation, draft release, real
# publish) and the tag=version check are skipped, and they are deliberately
# tiny.
name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

# Nothing at the workflow level writes; the publish job below grants exactly
# what its steps use.
permissions:
  contents: read

# A re-pushed/re-tagged release must not run concurrently with an already-
# running publish - both would try to publish the same name@version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned release toolchain - keep in sync with ci.yml's repro job.
  RELEASE_TOOLCHAIN: '1.97.0'
  # cargo-cyclonedx on crates.io - keep in sync with docs/VERIFYING.md.
  CYCLONEDX_CLI_VERSION: '0.5.10'

jobs:
  publish:
    runs-on: windows-latest
    # One runner for the whole pipeline: the release build, both test
    # suites, release-check, the cargo-cyclonedx compile (minutes on its
    # own) and the draft release. The old publish-only bound of 20 minutes
    # does not fit the SBOM tool compile.
    timeout-minutes: 40
    permissions:
      # Creates the draft release.
      contents: write
      # Artifact attestation needs both of these.
      attestations: write
      # npm's OIDC token exchange and the attestation both need this.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release-check's CHANGELOG compare-base check needs the full tag
          # history - the default single-commit shallow checkout has no tags
          # at all, so it would always fail that check on a real publish run.
          fetch-depth: 0
          # Nothing in this job pushes to git (release-check only lists tags
          # locally; npm publishes via OIDC), so the checkout's cached
          # credentials are dropped immediately.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The one check that only makes sense on a real tag; the dispatch
      # rehearsal skips it.
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # OIDC trusted publishing needs npm CLI >=11.5 - pinned, not @latest, so
      # a future npm release can't change publish behavior out from under this
      # tag.
      - name: Install pinned npm
        shell: bash
        run: npm install -g npm@11.5.1

      - name: Install
        shell: bash
        run: npm install

      - name: Build wnice.exe (release recipe)
        shell: bash
        timeout-minutes: 20
        env:
          # Measured by ci.yml's repro job (commit bd4e365, one CI run, two
          # clean trees at different paths): without /Brepro the builds
          # differed, with /Brepro they were bit-identical. The remap keeps
          # the binary independent of the runner's absolute checkout path;
          # /Brepro drops the linker's timestamp from the PE header.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src -C link-arg=/Brepro
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal
          rustup default "$RELEASE_TOOLCHAIN"
          cargo build --release --locked

      # npm pack refuses without it - prepack check.
      - name: Stage bin/wnice.exe
        shell: bash
        run: node install/stage-exe.js

      - name: Node test suite (installer logic)
        shell: bash
        run: npm test

      - name: Pester test suite (real tool behavior)
        shell: powershell
        run: |
          # See ci.yml's identical step for why: GitHub Actions defaults
          # $ErrorActionPreference to 'Stop' for powershell-shell steps, which turns
          # every wrapped tool's non-terminating Write-Error (captured via 2>&1) into
          # a terminating error inside Invoke-Pester's own scope.
          $ErrorActionPreference = 'Continue'
          # Runners ship Pester 3.4.0 and 5.9.0 side by side; the suite uses v3 syntax.
          Import-Module Pester -MaximumVersion 3.99
          $result = Invoke-Pester -Path test\pester -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
          exit 0

      - name: Verify the actual packed artifact (scripts/release-check.js)
        shell: bash
        # Source-tree tests above never touch the packed tarball itself - a
        # files-whitelist mistake or a CHANGELOG/tag drift (the exact class of
        # bug round 11's review caught by hand) could still slip past both
        # suites. Installs the real tarball into an isolated WIN_NICE_HOME,
        # verifies manifest version/launcher names, smoke-tests capc/capt/capm/caps/capn's
        # exit code, and cross-checks CHANGELOG's latest heading/compare-base tag.
        run: npm run release-check

      # The pipeline's only `npm pack`: the tarball whose exact bytes get
      # attested, attached to the draft release and published. The tarball
      # name is deterministic (<name>-<version>.tgz from package.json), so
      # nothing is parsed out of npm's stdout (lifecycle-script output can
      # leak into it).
      - name: Pack the release tarball (once)
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          test -f "release-assets/win-nice-$version.tgz" || {
            echo "npm pack did not produce release-assets/win-nice-$version.tgz" >&2
            exit 1
          }

      # Official CycloneDX plugin for Cargo: sources Cargo.lock + cargo
      # metadata (licenses, purls). Installed from crates.io with checksum
      # verification, no third-party binary downloads. Command flags verified
      # against cargo-cyclonedx 0.5.10 --help. The RUSTFLAGS remap above is
      # step-level env, so this `cargo install` builds the tool without it -
      # keep it that way.
      - name: Rust dependency SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version "$CYCLONEDX_CLI_VERSION" --locked
          cargo cyclonedx -f json --spec-version 1.5 --override-filename 'rust-deps.cdx'
          test -f rust-deps.cdx.json

      # Built into npm - no extra tool is fetched. Flags verified against
      # npm 11 docs.
      - name: npm package SBOM (CycloneDX)
        shell: bash
        run: npm sbom --sbom-format cyclonedx --sbom-type application > release-assets/npm-deps.cdx.json

      # bin/wnice.exe (what the tarball ships) and target/release/wnice.exe
      # are byte-identical copies - see install/stage-exe.js.
      - name: Collect release assets
        shell: bash
        run: |
          cp target/release/wnice.exe release-assets/wnice.exe
          cp rust-deps.cdx.json release-assets/
          ls -l release-assets

      # Basenames only, so `sha256sum -c` works in any download directory.
      - name: SHA256SUMS
        shell: bash
        run: |
          (cd release-assets && sha256sum wnice.exe win-nice-*.tgz rust-deps.cdx.json npm-deps.cdx.json > SHA256SUMS)
          cat release-assets/SHA256SUMS

      # package.json's version: a dispatch run has no tag, and on a tag push
      # the tag was already checked to equal package.json above.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node scripts/release-notes.js "$(node -p "require('./package.json').version")" > "$RUNNER_TEMP/release-notes.md"

      # ---------- Tag-only steps (deliberately tiny: the workflow_dispatch
      # rehearsal above exercised everything else, including a dry-run
      # publish). ----------

      # Needs the job's id-token + attestations permissions. SHA256SUMS itself
      # is attested so users can anchor on it.
      - name: Attest release artifacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/wnice.exe
            release-assets/win-nice-*.tgz
            release-assets/rust-deps.cdx.json
            release-assets/npm-deps.cdx.json
            release-assets/SHA256SUMS

      # Idempotent re-run: if a previous attempt failed after creating the
      # draft, the stale DRAFT of this tag is deleted and recreated with
      # fresh assets and notes. An already-PUBLISHED release is never touched
      # - that case exits with an error. `gh` never creates the tag itself:
      # --verify-tag aborts unless the pushed tag already exists remotely.
      - name: Create the draft GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "release $TAG already exists and is published - refusing to touch it" >&2
              exit 1
            fi
            echo "stale draft of $TAG found - deleting it to recreate with fresh assets and notes"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "win-nice $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" release-assets/wnice.exe release-assets/win-nice-*.tgz release-assets/rust-deps.cdx.json release-assets/npm-deps.cdx.json release-assets/SHA256SUMS

      # Publish is LAST and only on a tag: it uploads the exact tarball bytes
      # attested and attached above. A failure in any earlier step therefore
      # never publishes anything.
      # win-nice@0.1.0's first publish used a classic NPM_TOKEN (Trusted
      # Publisher can't be configured for a package that doesn't exist yet).
      # The package now exists and Trusted Publisher is configured on its
      # npmjs.com settings page (org PHPCraftdream, repo win-nice, workflow
      # publish.yml, "Allow npm publish") - npm's OIDC token exchange
      # authenticates the publish with no token at all; id-token: write covers
      # both that exchange and the --provenance attestation signature.
      # --access public: still required even with a package that already
      # exists - npm's provenance check wants it explicit, not just implied by
      # being unscoped.
      - name: Publish the attested tarball to npm (last step, irreversible)
        if: github.event_name == 'push'
        timeout-minutes: 5
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npm publish "release-assets/win-nice-$version.tgz" --provenance --access public

      # Rehearsal: everything publish does except the upload - no registry
      # write, no OIDC exchange. Exercises the same tarball path and flags.
      - name: Rehearse publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npm publish "release-assets/win-nice-$version.tgz" --dry-run --access public

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Release artifacts'
            echo
            echo '- wnice.exe (native binary)'
            echo '- win-nice-*.tgz (npm package tarball)'
            echo '- rust-deps.cdx.json (Rust dependency SBOM, CycloneDX 1.5)'
            echo '- npm-deps.cdx.json (npm package SBOM, CycloneDX)'
            echo '- SHA256SUMS'
            echo
            echo '```'
            if [ -f release-assets/SHA256SUMS ]; then
              cat release-assets/SHA256SUMS
            else
              echo '(no SHA256SUMS - an earlier step failed)'
            fi
            echo '```'
            echo
            if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
              echo 'Tag push: attestation, draft release and npm publish ran.'
            else
              echo 'Rehearsal (workflow_dispatch): attestation, draft release and the real publish were skipped; `npm publish --dry-run` ran instead.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
