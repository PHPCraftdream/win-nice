name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # OIDC trusted publishing needs npm CLI >=11.5 - pinned, not @latest, so a
      # future npm release can't change publish behavior out from under this tag.
      - name: Install pinned npm
        run: npm install -g npm@11.5.1

      - name: Install
        run: npm install

      - name: Node test suite (installer logic)
        run: npm test

      - name: Pester test suite (real tool behavior)
        shell: powershell
        run: |
          # See ci.yml's identical step for why: GitHub Actions defaults
          # $ErrorActionPreference to 'Stop' for powershell-shell steps, which turns
          # every wrapped tool's non-terminating Write-Error (captured via 2>&1) into
          # a terminating error inside Invoke-Pester's own scope.
          $ErrorActionPreference = 'Continue'
          # Runners ship Pester 3.4.0 and 5.9.0 side by side; the suite uses v3 syntax.
          Import-Module Pester -MaximumVersion 3.99
          $result = Invoke-Pester -Path test\win-nice.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Publish
        run: npm publish --provenance
        env:
          # First-ever publish: npm's OIDC "Trusted Publisher" can only be configured
          # on a package that already exists on the registry (there's no settings page
          # for a name that's never been published), so this uses a classic token for
          # auth. --provenance still works with token auth - it only needs id-token:
          # write (already granted above) for the attestation signature, independent
          # of how the publish itself authenticates. Once this first publish creates
          # the package, npm's Trusted Publisher can be configured on its settings
          # page for future releases, and this can switch to token-free OIDC auth.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
