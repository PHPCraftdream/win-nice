name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs a recent npm CLI (>=11.5).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance
