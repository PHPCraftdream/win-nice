name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # The prebuilt Rust binary is built once here and shared with every matrix
  # leg via an artifact - rebuilding it 4x (once per Node version) buys nothing.
  build-exe:
    runs-on: windows-latest
    # Cargo release builds of a cold cache can take a while; cap the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # windows-latest ships rustup; install the stable toolchain explicitly
      # (minimal profile + clippy/rustfmt) instead of relying on whatever
      # default toolchain the runner image happens to pin.
      - name: Set up stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --locked

      - name: cargo build --release
        shell: bash
        run: cargo build --release --locked

      - name: Upload wnice.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wnice-exe
          path: target/release/wnice.exe

  test:
    # Waits on the shared prebuilt binary from build-exe.
    needs: build-exe
    runs-on: windows-latest
    # Upper bound for the whole job (npm install + both suites): an unbounded hang
    # would otherwise occupy the runner for the 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engines.node in package.json says >=18 - test the floor, not just latest.
        node-version: [18, 20, 22, 24]
    steps:
      # fetch-depth: 0 (full history + tags) - only release-check.js (below)
      # actually needs it, but the checkout step is shared across the whole
      # matrix and this is cheap.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      # Grabs the binary built once by build-exe; path: bin drops it at
      # bin/wnice.exe (gitignored, so the checkout never contains it).
      - name: Download prebuilt wnice.exe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wnice-exe
          path: bin

      - name: Install
        run: npm install

      - name: Node test suite (installer logic)
        run: npm test

      - name: Pester test suite (real tool behavior)
        shell: powershell
        run: |
          # GitHub Actions defaults $ErrorActionPreference to 'Stop' for powershell-
          # shell steps; that leaks into Invoke-Pester's own scope (Pester 3 runs each
          # It block in-process) and turns every non-terminating stderr line from a
          # wrapped tool's Write-Error (captured via 2>&1) into a terminating error,
          # aborting the test before its own Should assertion ever runs - confirmed:
          # every one of this suite's "expect a Write-Error + nonzero exit" tests
          # failed this way on a real run, none of the "expect success" tests did.
          # Reset to PowerShell's normal default so native-command stderr behaves the
          # same way here as it does locally.
          $ErrorActionPreference = 'Continue'
          # Runners ship Pester 3.4.0 and 5.9.0 side by side; the suite uses v3 syntax.
          Import-Module Pester -MaximumVersion 3.99
          $result = Invoke-Pester -Path test\pester -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
          exit 0

      - name: PowerShell 7 (pwsh) smoke test
        # The tools are native exes now; this checks that pwsh's native-command
        # argument passing reaches them intact. One matrix leg is enough.
        if: matrix.node-version == 24
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'wnice-pwsh-smoke'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          foreach ($t in 'idle', 'caps', 'capc') { Copy-Item (Join-Path 'bin' 'wnice.exe') (Join-Path $bin "$t.exe") }
          $cases = @(
              @{ Tool = 'idle'; Args = @('cmd', '/c', 'exit', '7'); Expected = 7 },
              @{ Tool = 'caps'; Args = @('5', 'cmd', '/c', 'exit', '4'); Expected = 4 },
              @{ Tool = 'capc'; Args = @('50', 'cmd', '/c', 'exit', '6'); Expected = 6 }
          )
          $failed = $false
          foreach ($case in $cases) {
              $toolArgs = $case.Args
              & (Join-Path $bin "$($case.Tool).exe") @toolArgs
              if ($LASTEXITCODE -ne $case.Expected) {
                  Write-Error "pwsh smoke: $($case.Tool) expected exit $($case.Expected), got $LASTEXITCODE"
                  $failed = $true
              }
          }
          # Explicit exit: otherwise the step inherits the last native exit code.
          if ($failed) { exit 1 }
          exit 0

      - name: Verify the actual packed artifact (scripts/release-check.js)
        # Only one matrix leg needs to run this - it's a gate on the tarball
        # itself, not on any given Node version, and running it 4x buys
        # nothing. A break here (as in review rounds 12-13: shallow checkout,
        # shell:true) would otherwise only surface in the tag-triggered
        # publish job, after a tag already exists.
        if: matrix.node-version == 24
        shell: bash
        run: npm run release-check
