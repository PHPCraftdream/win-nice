name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: nothing in CI publishes or pushes, so every job runs with
# read-only access to the repo.
permissions:
  contents: read

# Cancel superseded runs of the same ref. On pull_request this kills a PR's
# outdated run as new commits arrive; pushes to main/master are never
# cancelled - a cancelled push run would hide the branch's real state.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The prebuilt Rust binary is built once per OS image here and handed to
  # the test job via per-OS artifacts.
  build-exe:
    strategy:
      # Run both images even if one fails, so a windows-2022-only regression
      # is never masked by an early windows-2025 failure.
      fail-fast: false
      matrix:
        # Explicit runner images instead of the floating windows-latest:
        # "latest" silently moves to new Windows versions, so a break lands
        # in CI before anyone chose it. These two are the currently supported
        # Windows Server images (windows-latest itself now points at 2025).
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # Cargo release builds of a cold cache can take a while; cap the job.
    timeout-minutes: 30
    steps:
      # Nothing here pushes to git, so the checkout's cached credentials are
      # dropped immediately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every windows image ships rustup; install the stable toolchain
      # explicitly (minimal profile + clippy/rustfmt) instead of relying on
      # whatever default toolchain the runner image happens to pin.
      - name: Set up stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --locked

      - name: cargo build --release
        shell: bash
        run: cargo build --release --locked

      - name: Upload wnice.exe artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wnice-exe-${{ matrix.os }}
          path: target/release/wnice.exe

  test:
    # Waits on the per-OS prebuilt binaries from build-exe.
    needs: build-exe
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    # Upper bound for the whole job (npm install + both suites): an unbounded hang
    # would otherwise occupy the runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 (full history + tags): release-check.js (below) needs
      # the tags. It only lists them locally (`git tag --list`), and npm
      # install has no git dependencies, so no persisted credentials are
      # needed anywhere in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Grabs the binary built once by build-exe on the SAME image; path: bin
      # drops it at bin/wnice.exe (gitignored, so the checkout never contains
      # it).
      - name: Download prebuilt wnice.exe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wnice-exe-${{ matrix.os }}
          path: bin

      - name: Install
        # npm run scripts execute under npm's own script shell either way; the
        # explicit bash makes every run step in this file shell-explicit.
        shell: bash
        run: npm install

      - name: Node test suite (installer logic)
        # npm run scripts execute under npm's own script shell either way; the
        # explicit bash makes every run step in this file shell-explicit.
        shell: bash
        run: npm test

      - name: Pester test suite (real tool behavior)
        shell: powershell
        run: |
          # GitHub Actions defaults $ErrorActionPreference to 'Stop' for powershell-
          # shell steps; that leaks into Invoke-Pester's own scope (Pester 3 runs each
          # It block in-process) and turns every non-terminating stderr line from a
          # wrapped tool's Write-Error (captured via 2>&1) into a terminating error,
          # aborting the test before its own Should assertion ever runs - confirmed:
          # every one of this suite's "expect a Write-Error + nonzero exit" tests
          # failed this way on a real run, none of the "expect success" tests did.
          # Reset to PowerShell's normal default so native-command stderr behaves the
          # same way here as it does locally.
          $ErrorActionPreference = 'Continue'
          # Runners ship Pester 3.4.0 and 5.9.0 side by side; the suite uses v3 syntax.
          Import-Module Pester -MaximumVersion 3.99
          $result = Invoke-Pester -Path test\pester -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
          exit 0

      - name: PowerShell 7 (pwsh) smoke test
        # The tools are native exes now; this checks that pwsh's native-command
        # argument passing reaches them intact.
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'wnice-pwsh-smoke'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          foreach ($t in 'idle', 'caps', 'capc') { Copy-Item (Join-Path 'bin' 'wnice.exe') (Join-Path $bin "$t.exe") }
          $cases = @(
              @{ Tool = 'idle'; Args = @('cmd', '/c', 'exit', '7'); Expected = 7 },
              @{ Tool = 'caps'; Args = @('5', 'cmd', '/c', 'exit', '4'); Expected = 4 },
              @{ Tool = 'capc'; Args = @('50', 'cmd', '/c', 'exit', '6'); Expected = 6 }
          )
          $failed = $false
          foreach ($case in $cases) {
              $toolArgs = $case.Args
              & (Join-Path $bin "$($case.Tool).exe") @toolArgs
              if ($LASTEXITCODE -ne $case.Expected) {
                  Write-Error "pwsh smoke: $($case.Tool) expected exit $($case.Expected), got $LASTEXITCODE"
                  $failed = $true
              }
          }
          # Explicit exit: otherwise the step inherits the last native exit code.
          if ($failed) { exit 1 }
          exit 0

      - name: Verify the actual packed artifact (scripts/release-check.js)
        # A break here (as in review rounds 12-13: shallow checkout,
        # shell:true) would otherwise only surface in the tag-triggered
        # publish job, after a tag already exists.
        shell: bash
        run: npm run release-check

  # Verifies Cargo.toml's declared rust-version by compiling with exactly
  # that toolchain. The declared floor is evidence-based, not guessed:
  # - src/run/mod.rs uses `u32::is_multiple_of` (stable in 1.87);
  # - src/run/fakesys.rs uses the `#[expect]` attribute (stable in 1.81);
  # - Cargo.lock is lockfile-format v4, which cargo < 1.78 cannot parse;
  # - the only dependency (windows-sys 0.59) declares rust-version 1.60.
  # This job is the arbiter: it reads the version from Cargo.toml instead of
  # duplicating it here, so raising rust-version in Cargo.toml is all it
  # takes to move the floor. If this job fails on 1.87, the real floor is
  # higher - raise rust-version to the version this job's output points at.
  msrv:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the declared MSRV from Cargo.toml
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)"/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "rust-version is missing from Cargo.toml" >&2
            exit 1
          fi
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install the declared MSRV toolchain
        shell: bash
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: cargo check on the declared MSRV
        shell: bash
        run: rustup run "$MSRV" cargo check --locked --all-targets

  # Dependency security gate: OSV/GH advisories, the license allow-list (the
  # project and its whole dependency tree are MIT OR Apache-2.0), duplicate-
  # crate and registry-source checks. Configuration: deny.toml at the repo
  # root. cargo-deny only parses manifests and the lockfile (no Rust code is
  # compiled), so this job is cheap and Linux-hosted.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: cargo-deny check (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Reproducible-build check: builds wnice.exe twice from two clean source
  # trees at DIFFERENT absolute paths, with the same pinned toolchain and the
  # same RUSTFLAGS remap the release recipe (publish.yml) uses,
  # then compares sha256. It mirrors the release recipe and is deliberately
  # NON-BLOCKING: a mismatch must be visible but must not fail CI - per
  # project policy this is decided deliberately, see docs/RELEASING.md.
  repro:
    runs-on: windows-latest
    # Cap for two full release builds (build-exe's single build gets 30).
    timeout-minutes: 40
    env:
      # Pinned release toolchain - keep in sync with publish.yml. ci.yml's
      # other jobs intentionally keep tracking floating
      # `stable` (early-warning); only this job pins.
      RELEASE_TOOLCHAIN: '1.97.0'
      # The release recipe builds with this remap, so the binary must not
      # depend on the checkout's absolute path. Proving that requires the two
      # clean builds below to happen in DIFFERENT absolute paths.
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the pinned release toolchain
        shell: bash
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal
          rustup default "$RELEASE_TOOLCHAIN"

      - name: Build #1 (checkout dir)
        shell: bash
        run: cargo build --release --locked

      # Second independent source tree at a different absolute path.
      - name: Second clean checkout
        shell: bash
        run: git clone --no-hardlinks --quiet . "$RUNNER_TEMP/repro-build-two"

      - name: Build #2 (independent dir)
        shell: bash
        run: cd "$RUNNER_TEMP/repro-build-two" && cargo build --release --locked

      - name: Compare sha256 and record the verdict
        shell: bash
        run: |
          h1=$(sha256sum target/release/wnice.exe | cut -d' ' -f1)
          h2=$(sha256sum "$RUNNER_TEMP/repro-build-two/target/release/wnice.exe" | cut -d' ' -f1)
          {
            echo '| build | sha256 of wnice.exe |'
            echo '| --- | --- |'
            echo "| #1 (checkout dir) | \`$h1\` |"
            echo "| #2 ($RUNNER_TEMP/repro-build-two) | \`$h2\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$h1" = "$h2" ]; then
            echo 'result: **bit-identical**' >> "$GITHUB_STEP_SUMMARY"
            echo '::notice::two clean release builds produced bit-identical wnice.exe'
          else
            {
              echo 'result: **MISMATCH**'
              echo
              echo "- build #1: \`$h1\`"
              echo "- build #2: \`$h2\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::release builds are not bit-identical - see the summary table'
          fi
          # Informative by design: exit 0 in BOTH cases - a mismatch must be
          # visible but must not block CI (see the job comment above).
          exit 0

  # Doc-build gate: rustdoc lints (broken intra-doc links, etc.) fail the job
  # via -D warnings. Windows runner: the crate's Win32 code is not cfg-gated,
  # so the crate only builds on a Windows host.
  doc:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: cargo doc
        shell: bash
        run: cargo doc --locked --no-deps
