# Draft release pipeline for version tags (v*.*.*).
#
# What it does on a tag push:
# - builds wnice.exe and the npm tarball with exactly the publish.yml recipe
#   (pinned toolchain, --remap-path-prefix, --release --locked);
# - produces CycloneDX SBOMs for the Rust dependency tree (cargo-cyclonedx)
#   and the npm package (npm sbom), plus a SHA256SUMS over all artifacts;
# - attests every release artifact with GitHub artifact attestations;
# - extracts the release notes from the CHANGELOG section for the pushed tag
#   and creates a DRAFT GitHub Release with all artifacts attached.
#
# The owner reviews the attestations/checksums and publishes the draft
# manually. npm publishing stays in publish.yml (untouched). A manual
# workflow_dispatch run on a branch is a rehearsal: it runs build + SBOM +
# checksums only - no attestation is created and no release is created.
#
# No caches anywhere (zizmor cache-poisoning audit; also release integrity).
name: Release (draft)

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry-run rehearsal on a branch: build+SBOM+checksums only, no
  # attestation/release.
  workflow_dispatch: {}

# Nothing at the workflow level writes; the job below grants exactly what its
# steps use.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned release toolchain - keep in sync with ci.yml's repro job and
  # publish.yml.
  RELEASE_TOOLCHAIN: '1.97.0'
  # cargo-cyclonedx on crates.io - keep in sync with docs/VERIFYING.md and the
  # RELEASING doc.
  CYCLONEDX_CLI_VERSION: '0.5.10'

jobs:
  release:
    # Must match the environment the npm package is built in (publish.yml
    # uses windows-latest): the Release asset and the npm tarball's exe must
    # be bit-identical.
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      # Creates the draft release.
      contents: write
      # Artifact attestation needs both of these.
      attestations: write
      id-token: write
    steps:
      # fetch-depth: 0: release-check.js (below) cross-checks the CHANGELOG
      # compare-link against real git tags. Nothing here pushes to git, so
      # the checkout's cached credentials are dropped immediately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Same pin as publish.yml - OIDC-capable, and `npm sbom`/`npm pack`
      # behavior stays identical between the two workflows.
      - name: Install pinned npm
        shell: bash
        run: npm install -g npm@11.5.1

      # No runtime dependencies; this also materializes package-lock.json,
      # which `npm sbom` reads.
      - name: Install
        shell: bash
        run: npm install

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal
          rustup default "$RELEASE_TOOLCHAIN"

      # RUSTFLAGS is deliberately step-level env: the `cargo install` in the
      # SBOM step below inherits no remap (it compiles the tool from crates.io
      # sources, not this checkout) - keep it that way.
      - name: Build wnice.exe (release recipe)
        shell: bash
        env:
          # Makes the binary independent of the runner's absolute checkout
          # path - same recipe as publish.yml and ci.yml's repro job.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: cargo build --release --locked

      # npm pack refuses without it - prepack check.
      - name: Stage bin/wnice.exe
        shell: bash
        run: node install/stage-exe.js

      # Installs the packed tarball into an isolated home and smoke-tests it,
      # so a broken draft release can't happen while publish would also fail.
      - name: Release gate (same as publish.yml runs before npm publish)
        shell: bash
        run: npm run release-check

      - name: Build the release npm tarball
        shell: bash
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          tgz=$(node -e "const p=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/pack.json','utf8'))[0].filename; process.stdout.write(p)")
          test -f "$tgz" || { echo "npm pack did not produce $tgz" >&2; exit 1; }
          mkdir -p release-assets
          cp "$tgz" release-assets/

      # Official CycloneDX plugin for Cargo: sources Cargo.lock + cargo
      # metadata (licenses, purls). Installed from crates.io with checksum
      # verification, no third-party binary downloads. Command flags verified
      # against cargo-cyclonedx 0.5.10 --help.
      - name: Rust dependency SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version "$CYCLONEDX_CLI_VERSION" --locked
          cargo cyclonedx -f json --spec-version 1.5 --override-filename 'rust-deps.cdx'
          test -f rust-deps.cdx.json

      # Flags verified against npm 11 docs; `npm sbom` is built into npm, so
      # no extra tool is fetched.
      - name: npm package SBOM (CycloneDX)
        shell: bash
        run: npm sbom --sbom-format cyclonedx --sbom-type application > release-assets/npm-deps.cdx.json

      # bin/wnice.exe and target/release/wnice.exe are byte-identical copies -
      # see install/stage-exe.js; the Release asset must hash-match what the
      # npm tarball ships.
      - name: Collect release assets
        shell: bash
        run: |
          cp target/release/wnice.exe release-assets/wnice.exe
          cp rust-deps.cdx.json release-assets/
          ls -l release-assets

      # Basenames only, so `sha256sum -c` works in any download directory.
      - name: SHA256SUMS
        shell: bash
        run: |
          (cd release-assets && sha256sum wnice.exe win-nice-*.tgz rust-deps.cdx.json npm-deps.cdx.json > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        shell: bash
        run: node scripts/release-notes.js "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # Needs the job's id-token + attestations permissions. SHA256SUMS itself
      # is attested so users can anchor on it.
      - name: Attest release artifacts
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/wnice.exe
            release-assets/win-nice-*.tgz
            release-assets/rust-deps.cdx.json
            release-assets/npm-deps.cdx.json
            release-assets/SHA256SUMS

      # --verify-tag aborts unless the pushed tag already exists remotely, so
      # gh can never create its own unsigned tag. The release stays a DRAFT -
      # the owner reviews attestations/checksums and publishes manually.
      - name: Create the draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "win-nice $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" release-assets/wnice.exe release-assets/win-nice-*.tgz release-assets/rust-deps.cdx.json release-assets/npm-deps.cdx.json release-assets/SHA256SUMS

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Release artifacts'
            echo
            echo '- wnice.exe (native binary)'
            echo '- win-nice-*.tgz (npm package tarball)'
            echo '- rust-deps.cdx.json (Rust dependency SBOM, CycloneDX 1.5)'
            echo '- npm-deps.cdx.json (npm package SBOM, CycloneDX)'
            echo '- SHA256SUMS'
            echo
            echo '```'
            if [ -f release-assets/SHA256SUMS ]; then
              cat release-assets/SHA256SUMS
            else
              echo '(no SHA256SUMS - an earlier step failed)'
            fi
            echo '```'
            echo
            if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
              echo 'Artifact attestation and draft release: ran.'
            else
              echo 'Rehearsal (workflow_dispatch): attestation and draft release were skipped.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
