# cargo-deny gate; run by the "deny" job in .github/workflows/ci.yml.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# The dependency tree is windows-sys 0.59 -> windows-targets 0.52 -> 8
# target-only windows_* crates - all MIT OR Apache-2.0, one version each.
# This file keeps it that way: a new advisory, license, duplicate crate or
# non-crates.io source must be triaged here, not merged silently.

[advisories]
version = 2
# When an advisory fires, add an `ignore` entry ONLY with a comment stating
# why the locked version is unaffected, and remove it once a fixed version
# is locked.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
]
# The project is dual-licensed MIT OR Apache-2.0; everything it depends on
# (windows-sys and its target plumbing) carries the same dual license.

[bans]
# One binary, one dependency chain: any duplicated version in the tree is a
# supply-chain smell, not a build necessity.
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-index = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
]
